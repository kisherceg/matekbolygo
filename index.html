<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heti Diák Riport</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 20px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #2980b9; }
        .result-card { display: none; margin-top: 20px; }
        .score-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 20px 0; }
        .score-item { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid #3498db; }
        .score-number { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .chart-container { margin-top: 30px; }
        .note-box { background: #eef9ff; padding: 15px; border-radius: 8px; border-left: 4px solid #00a8ff; margin-top: 15px; }
        .note-title { font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Heti Diák Riport</h1>
    <div class="search-box">
        <input type="text" id="studentCode" placeholder="Írd be a gyermek kódját...">
        <button onclick="fetchReport()">Lekérdezés</button>
    </div>

    <div id="resultCard" class="result-card">
        <h2 id="studentName"></h2>
        <p><strong>Utolsó frissítés:</strong> <span id="reportDate"></span></p>

        <div class="score-board">
            <div class="score-item"><div>🏠 Házi</div><div class="score-number" id="haziScore">-</div></div>
            <div class="score-item"><div>📖 Elmélet</div><div class="score-number" id="elmeletScore">-</div></div>
            <div class="score-item"><div>🙋‍♂️ Órai</div><div class="score-number" id="oraiScore">-</div></div>
            <div class="score-item"><div>✏️ Teszt</div><div class="score-number" id="tesztScore">-</div></div>
        </div>

        <div class="note-box">
            <div class="note-title">🏠 Házi & Elmélet értékelés:</div>
            <p id="haziNote">-</p>
        </div>

        <div class="note-box" style="border-left-color: #2ecc71; background-color: #f0fff4;">
            <div class="note-title">✏️ Órai munka & Teszt értékelés:</div>
            <p id="tesztNote">-</p>
        </div>

        <div class="chart-container">
            <h3>📈 Tesztek alakulása</h3>
            <canvas id="tesztChart"></canvas>
        </div>
    </div>
</div>

<script>
    // Cseréld ki ezt a saját Google Sheet azonosítódra!
    const SHEET_ID = '1zS0yDwqOhtmTC9tPU08LpXiNGcWqIy8Ut_J-CkZz1Cc';
    const CSV_URL = https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv;

    let myChart = null;

    async function fetchReport() {
        const inputCode = document.getElementById('studentCode').value.trim();
        if(!inputCode) return alert('Kérlek írd be a kódot!');

        try {
            const response = await fetch(CSV_URL);
            const data = await response.text();
            const rows = data.split('\n').map(row => row.split(',').map(cell => cell.replace(/"/g, '').trim()));
            
            const studentRows = rows.filter(r => r[0] === inputCode);

            if(studentRows.length === 0) {
                alert('Nem található diák ezzel a kóddal!');
                return;
            }

            const latest = studentRows[studentRows.length - 1];

            document.getElementById('studentName').innerText = latest[1];
            document.getElementById('reportDate').innerText = latest[2];
            document.getElementById('haziScore').innerText = latest[3] + ' / 10';
            document.getElementById('elmeletScore').innerText = latest[4] + ' / 10';
            document.getElementById('oraiScore').innerText = latest[5] + ' / 10';
            document.getElementById('tesztScore').innerText = latest[6] + ' / 10';
            document.getElementById('haziNote').innerText = latest[7] || 'Nincs külön megjegyzés.';
            document.getElementById('tesztNote').innerText = latest[8] || 'Nincs külön megjegyzés.';

            document.getElementById('resultCard').style.display = 'block';

            const dates = studentRows.map(r => r[2]);
            const testScores = studentRows.map(r => parseFloat(r[6]));

            renderChart(dates, testScores);

        } catch (error) {
            alert('Hiba történt az adatok lekérésekor.');
            console.error(error);
        }
    }

    function renderChart(labels, data) {
        const ctx = document.getElementById('tesztChart').getContext('2d');
        if(myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Teszt eredmények',
                    data: data,
                    borderColor: '#2ecc71',
                    backgroundColor: 'rgba(46, 204, 113, 0.2)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                scales: { y: { min: 0, max: 10 } }
            }
        });
    }
</script>

</body>
</html>
