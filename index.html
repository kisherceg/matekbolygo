<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heti Diák Riport</title>
</head>
<body>

    <div style="max-width: 500px; margin: 50px auto; font-family: sans-serif;">
        <h2>Diák Riport Lekérdezés</h2>
        
        <!-- Input mező a kódnak -->
        <input type="text" id="studentCode" placeholder="Írd be a kódot (pl. VM26)" style="padding: 10px; font-size: 16px; text-transform: uppercase;">
        
        <!-- Lekérdezés gomb -->
        <button onclick="fetchReport()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Lekérdezés</button>

        <!-- Eredményeket megjelenítődoboz -->
        <div id="output" style="margin-top: 20px; font-weight: bold;"></div>
    </div>

    <script>
        // Itt fogjuk lépésről lépésre felépíteni a JavaScript logikát
        function fetchReport() {
            const code = document.getElementById('studentCode').value.trim();
            console.log("Keresett kód:", code);
            document.getElementById('output').innerText = "Keresés alatt: " + code;
        }
    </script>

</body>
</html>
